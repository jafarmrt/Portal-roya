name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Opens every page of the built portal in Chrome as admin, employee and guest; a blank page,
      # crash or console error fails the build, so no release is published.
      - name: Browser smoke tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Every green commit on main is published as a ready-to-run bundle. The server
  # installs it with deploy/update.sh, so it never needs npm or node_modules.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # build-info.json tells the running portal (footer, server status) and update.sh which build this is.
      - name: Package
        env:
          TAG: build-${{ github.run_number }}
        run: |
          node -e 'require("fs").writeFileSync("build-info.json", JSON.stringify({
            version: require("./package.json").version, build: process.env.TAG,
            commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString() }, null, 2) + "\n")'
          cat build-info.json
          tar -czf roya-portal.tar.gz dist server-dist drizzle deploy package.json build-info.json CHANGELOG.md .env.example
          ls -lh roya-portal.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          gh release create "$TAG" roya-portal.tar.gz \
            --target "$GITHUB_SHA" --latest \
            --title "v$VERSION ($TAG)" \
            --notes "Version $VERSION, commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
      - name: Remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
